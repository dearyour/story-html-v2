<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pier — 주문 · 환불 콘솔 (가상 데모)</title>
<!-- A fictional product used only as a capture target for the starter's example chapters.
     State comes from the hash (#tab=…&q=…&sel=…&modal=…&status=…) so every screen is reproducible;
     the search box also filters live so capture.mjs can record typing frame by frame.
     Replace it with the real app (or your own reconstruction) in a project. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --side: #fbfaf7; --ink: #1d1c19; --ink2: #5b5850; --ink3: #8f8b80;
  --line: #e7e4dc; --line2: #d9d5ca; --brand: #2f5bea; --brand-weak: #e8eeff; --ok: #1f9d6b; --ok-weak: #e3f5ec;
  --warn: #c7761a; --warn-weak: #fdf0de; --bad: #d4483b; --bad-weak: #fde7e4; --mute-weak: #efede7;
  font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-size: 14px; letter-spacing: -0.005em; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
.app { display: grid; grid-template-columns: 224px 1fr; height: 100vh; }
.side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 18px 14px; gap: 4px; }
.logo { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; font-weight: 800; font-size: 17px; letter-spacing: -0.02em; }
.logo i { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg, #2f5bea, #6d8cff); position: relative; }
.logo i::after { content: ""; position: absolute; inset: 8px 6px 6px 8px; border-left: 3px solid #fff; border-bottom: 3px solid #fff; border-radius: 0 0 0 3px; }
.logo small { font-weight: 600; font-size: 11px; color: var(--ink3); border: 1px solid var(--line2); border-radius: 6px; padding: 1px 6px; margin-left: auto; }
.nav { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px; color: var(--ink2); font-weight: 600; }
.nav svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.nav b { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--ink3); }
.nav.on { background: var(--panel); color: var(--ink); box-shadow: 0 1px 0 var(--line), 0 0 0 1px var(--line); }
.nav.on b { color: var(--brand); }
.side-h { margin: 16px 10px 6px; font-size: 11.5px; font-weight: 700; color: var(--ink3); letter-spacing: 0.04em; }
.side-foot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); }
.side-foot i { width: 30px; height: 30px; border-radius: 50%; background: #d8e2ff; color: var(--brand); display: grid; place-items: center; font-style: normal; font-weight: 800; font-size: 13px; }
.side-foot div { display: grid; line-height: 1.3; }
.side-foot small { color: var(--ink3); font-size: 12px; }
.main { display: grid; grid-template-rows: 60px auto auto 1fr; min-width: 0; }
.top { display: flex; align-items: center; gap: 14px; padding: 0 24px; border-bottom: 1px solid var(--line); background: var(--panel); }
.crumb { color: var(--ink3); font-weight: 600; white-space: nowrap; }
.crumb b { color: var(--ink); }
.search { position: relative; flex: 0 1 420px; margin-left: 24px; }
.search input { width: 100%; height: 38px; border-radius: 10px; border: 1px solid var(--line2); background: var(--bg); padding: 0 40px 0 38px; font-size: 14px; outline: none; }
.search input:focus { border-color: var(--brand); background: #fff; box-shadow: 0 0 0 4px var(--brand-weak); }
.search svg { position: absolute; left: 12px; top: 11px; width: 16px; height: 16px; stroke: var(--ink3); fill: none; stroke-width: 2; }
.search kbd { position: absolute; right: 10px; top: 9px; font: 600 11px/18px ui-monospace, monospace; color: var(--ink3); border: 1px solid var(--line2); border-radius: 5px; padding: 0 6px; background: #fff; }
.top .sp { flex: 1; }
.range { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border: 1px solid var(--line2); border-radius: 9px; font-weight: 600; color: var(--ink2); white-space: nowrap; }
.btn { height: 36px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line2); background: #fff; font-weight: 700; white-space: nowrap; cursor: pointer; }
.btn.pri { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.bad { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn[disabled] { opacity: 0.55; cursor: default; }
.head { display: flex; align-items: flex-end; gap: 28px; padding: 22px 24px 14px; }
.head h1 { font-size: 24px; letter-spacing: -0.02em; }
.head p { color: var(--ink3); margin-top: 4px; }
.stats { display: flex; gap: 10px; margin-left: auto; }
.stat { min-width: 132px; padding: 10px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
.stat small { display: block; color: var(--ink3); font-weight: 600; font-size: 12px; }
.stat b { font-size: 20px; letter-spacing: -0.02em; }
.stat b em { font-style: normal; font-size: 12px; color: var(--ink3); margin-left: 4px; font-weight: 600; }
.tabs { display: flex; gap: 6px; padding: 0 24px; border-bottom: 1px solid var(--line); }
.tab { padding: 10px 12px 11px; font-weight: 700; color: var(--ink3); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab b { margin-left: 6px; font-size: 12px; padding: 1px 7px; border-radius: 999px; background: var(--mute-weak); color: var(--ink2); }
.tab.on { color: var(--ink); border-color: var(--ink); }
.tab.warn b { background: var(--warn-weak); color: var(--warn); }
.body { position: relative; overflow: hidden; }
.tablewrap { position: absolute; inset: 14px 24px 0 24px; overflow: hidden; border: 1px solid var(--line); border-bottom: 0; border-radius: 12px 12px 0 0; background: var(--panel); }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; font-weight: 700; color: var(--ink3); padding: 10px 14px; border-bottom: 1px solid var(--line); background: #fcfbf8; white-space: nowrap; }
td { padding: 0 14px; height: 48px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td.id { font: 700 13px ui-monospace, "SF Mono", monospace; letter-spacing: 0; }
td.amt { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
th.amt { text-align: right; }
td.t { color: var(--ink3); font-variant-numeric: tabular-nums; }
td .who { display: flex; align-items: center; gap: 8px; }
td .who i { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 800; color: #fff; }
tr.sel td { background: var(--brand-weak); }
tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--brand); }
.cb { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--line2); background: #fff; }
.badge { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12.5px; font-weight: 700; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.b-paid { background: var(--brand-weak); color: var(--brand); }
.b-ship { background: var(--mute-weak); color: var(--ink2); }
.b-req { background: var(--warn-weak); color: var(--warn); }
.b-done { background: var(--ok-weak); color: var(--ok); }
.empty { padding: 60px; text-align: center; color: var(--ink3); }
.drawer { position: absolute; top: 0; right: 0; bottom: 0; width: 440px; background: var(--panel); border-left: 1px solid var(--line); box-shadow: -24px 0 48px rgba(30, 28, 20, 0.08); display: flex; flex-direction: column; }
.dr-h { display: flex; align-items: center; gap: 10px; padding: 18px 20px 14px; border-bottom: 1px solid var(--line); }
.dr-h h2 { font: 800 19px ui-monospace, "SF Mono", monospace; letter-spacing: -0.01em; }
.dr-h .x { margin-left: auto; width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); display: grid; place-items: center; color: var(--ink3); }
.dr-b { flex: 1; overflow: hidden; padding: 16px 20px; display: grid; gap: 14px; align-content: start; }
.card { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.card h3 { font-size: 12px; color: var(--ink3); font-weight: 700; margin-bottom: 8px; }
.kv { display: grid; grid-template-columns: 76px 1fr; gap: 6px 10px; font-size: 13.5px; }
.kv dt { color: var(--ink3); }
.kv dd { font-weight: 600; }
.items li { display: flex; justify-content: space-between; list-style: none; padding: 5px 0; font-size: 13.5px; }
.items li span:last-child { font-weight: 700; font-variant-numeric: tabular-nums; }
.d-amount { display: flex; justify-content: space-between; align-items: baseline; padding-top: 8px; margin-top: 4px; border-top: 1px dashed var(--line2); }
.d-amount b { font-size: 20px; letter-spacing: -0.02em; }
.timeline { list-style: none; display: grid; gap: 10px; }
.timeline li { display: grid; grid-template-columns: 14px 1fr auto; gap: 10px; align-items: start; font-size: 13.5px; }
.timeline li i { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; background: var(--line2); box-shadow: 0 0 0 3px #fff, 0 0 0 4px var(--line); }
.timeline li.ok i { background: var(--ok); }
.timeline li.warn i { background: var(--warn); }
.timeline li.brand i { background: var(--brand); }
.timeline li small { color: var(--ink3); font-variant-numeric: tabular-nums; }
.timeline li p { color: var(--ink3); font-size: 12.5px; margin-top: 2px; }
.dr-f { display: flex; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line); }
.dr-f .btn { flex: 1; height: 42px; font-size: 14.5px; }
.veil { position: fixed; inset: 0; background: rgba(24, 22, 16, 0.36); display: grid; place-items: center; }
.modal { width: 460px; border-radius: 16px; background: #fff; box-shadow: 0 30px 80px rgba(20, 18, 12, 0.3); overflow: hidden; }
.modal h2 { font-size: 18px; padding: 20px 22px 6px; }
.modal > p { padding: 0 22px 14px; color: var(--ink3); }
.m-b { padding: 4px 22px 18px; display: grid; gap: 14px; }
.field { display: grid; gap: 6px; }
.field label { font-size: 12.5px; font-weight: 700; color: var(--ink2); }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line2); border-radius: 10px; overflow: hidden; }
.seg span { padding: 9px 12px; text-align: center; font-weight: 700; color: var(--ink3); }
.seg span.on { background: var(--brand-weak); color: var(--brand); }
.inp { height: 40px; border: 1px solid var(--line2); border-radius: 10px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; font-weight: 600; }
.chk { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.chk i { width: 18px; height: 18px; border-radius: 5px; background: var(--brand); position: relative; }
.chk i::after { content: ""; position: absolute; left: 6px; top: 2px; width: 5px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
.m-f { display: flex; gap: 8px; padding: 14px 22px 20px; }
.m-f .btn { height: 44px; font-size: 15px; }
.m-f .btn.bad { flex: 1; }
.toast { position: fixed; right: 24px; bottom: 24px; display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-radius: 12px; background: #1d1c19; color: #fff; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.25); font-weight: 600; }
.toast i { width: 22px; height: 22px; border-radius: 50%; background: var(--ok); position: relative; }
.toast i::after { content: ""; position: absolute; left: 8px; top: 4px; width: 5px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
.toast small { color: #b9b5aa; font-weight: 500; margin-left: 6px; }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><i></i>Pier<small>데모</small></div>
    <a class="nav"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>대시보드</a>
    <a class="nav on" id="navOrders"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>주문<b>128</b></a>
    <a class="nav" id="navRefund"><svg viewBox="0 0 24 24"><path d="M9 14l-5-5 5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>환불<b data-refund-count>6</b></a>
    <a class="nav"><svg viewBox="0 0 24 24"><path d="M12 3v18M7 7h7a3 3 0 0 1 0 6H9a3 3 0 0 0 0 6h8"/></svg>정산</a>
    <a class="nav"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>고객</a>
    <p class="side-h">상점</p>
    <a class="nav"><svg viewBox="0 0 24 24"><path d="M3 9l2-5h14l2 5M4 9v11h16V9M9 20v-6h6v6"/></svg>상품<b>42</b></a>
    <a class="nav"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>설정</a>
    <div class="side-foot"><i>가</i><div><b>가상 로스터리</b><small>데모 상점 · 운영자</small></div></div>
  </aside>
  <div class="main">
    <header class="top">
      <p class="crumb">주문 / <b data-crumb>전체</b></p>
      <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" placeholder="주문번호 · 고객 · 상품 검색" autocomplete="off"><kbd>/</kbd></label>
      <span class="sp"></span>
      <span class="range">10월 1일 – 10월 23일</span>
      <button class="btn">내보내기</button>
    </header>
    <section class="head">
      <div><h1>주문</h1><p>결제부터 환불까지 한 목록에서 처리합니다.</p></div>
      <div class="stats">
        <div class="stat"><small>오늘 주문</small><b>42<em>건</em></b></div>
        <div class="stat"><small>환불 요청</small><b data-stat-req>6<em>건</em></b></div>
        <div class="stat"><small>오늘 매출</small><b>1,284,000<em>원</em></b></div>
      </div>
    </section>
    <nav class="tabs" id="tabs"></nav>
    <section class="body" id="body">
      <div class="tablewrap"><table><thead><tr><th style="width:44px"><span class="cb" style="display:block"></span></th><th>주문번호</th><th>고객</th><th>상품</th><th class="amt">금액</th><th>상태</th><th>주문 시각</th></tr></thead><tbody id="rows"></tbody></table></div>
    </section>
  </div>
</div>
<div id="layer"></div>
<script>
const COLORS = ["#7c8cff", "#f08a5d", "#3fb68b", "#c77dff", "#e6a23c", "#4fb3d9", "#ef6f8a"];
const ORDERS = [
  ["A-1033", "정다온", "콜드브루 원액 1L", 18000, "paid", "10/23 09:41"],
  ["A-1032", "백시우", "드립백 20개입", 22000, "paid", "10/23 09:12"],
  ["A-1031", "윤서아", "핸드드립 원두 500g × 2", 34000, "req", "10/21 14:02"],
  ["A-1030", "문하람", "에스프레소 블렌드 1kg", 31000, "ship", "10/21 11:30"],
  ["A-1029", "고은결", "디카페인 원두 250g", 12500, "paid", "10/21 10:08"],
  ["A-1028", "장태오", "핸드드립 세트", 46000, "ship", "10/20 18:44"],
  ["A-1027", "서리안", "콜드브루 원액 1L × 2", 36000, "done", "10/20 15:21"],
  ["A-1026", "임도하", "드립백 10개입", 11000, "paid", "10/20 13:57"],
  ["A-1025", "한결", "싱글오리진 200g", 15000, "ship", "10/20 09:33"],
  ["A-1024", "오세린", "에스프레소 블렌드 500g", 17000, "req", "10/19 21:10"],
  ["A-1023", "남궁별", "머그 · 원두 선물 세트", 39000, "paid", "10/19 16:02"],
  ["A-1022", "최이안", "드립백 20개입", 22000, "done", "10/19 11:48"],
  ["A-1021", "류해솔", "디카페인 원두 500g", 21000, "ship", "10/18 20:15"],
  ["A-1020", "송가온", "콜드브루 원액 500ml", 9500, "paid", "10/18 14:26"],
];
const BADGE = { paid: ["b-paid", "결제 완료"], ship: ["b-ship", "배송 중"], req: ["b-req", "환불 요청"], done: ["b-done", "환불 완료"] };
const won = (n) => n.toLocaleString("ko-KR") + "원";
const qs = () => Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
const $ = (s) => document.querySelector(s);
let typed = null; // live value while someone types (capture.mjs fills the input frame by frame)

function render() {
  const st = qs();
  const q = (typed ?? st.q ?? "").trim();
  const refunded = st.status === "refunded";
  const rows = ORDERS.map((o) => (refunded && o[0] === st.sel ? [...o.slice(0, 4), "done", o[5]] : o));
  const count = (s) => rows.filter((o) => o[4] === s).length;
  $("#tabs").innerHTML = [["all", "전체", 128], ["paid", "결제 완료", 97], ["ship", "배송 중", 19], ["req", "환불 요청", count("req")], ["done", "환불 완료", count("done") + 4]]
    .map(([k, n, c]) => `<a class="tab${(st.tab || "all") === k ? " on" : ""}${k === "req" ? " warn" : ""}" data-tab="${k}">${n}<b>${c}</b></a>`).join("");
  $("[data-refund-count]").textContent = count("req");
  $("[data-stat-req]").innerHTML = `${count("req")}<em>건</em>`;
  if (document.activeElement !== $("#q")) $("#q").value = q;
  const tab = st.tab || "all";
  const list = rows.filter((o) => (tab === "all" || o[4] === tab) && (!q || o.slice(0, 3).join(" ").toLowerCase().includes(q.toLowerCase())));
  $("#rows").innerHTML = list.length
    ? list.map((o, i) => {
        const [cls, label] = BADGE[o[4]];
        const c = COLORS[ORDERS.findIndex((x) => x[0] === o[0]) % COLORS.length];
        return `<tr data-id="${o[0]}"${o[0] === st.sel ? ' class="sel"' : ""}><td><span class="cb" style="display:block"></span></td><td class="id">${o[0]}</td><td><span class="who"><i style="background:${c}">${o[1][0]}</i>${o[1]}</span></td><td>${o[2]}</td><td class="amt">${won(o[3])}</td><td><span class="badge ${cls}">${label}</span></td><td class="t">${o[5]}</td></tr>`;
      }).join("")
    : `<tr><td colspan="7" class="empty">「${q}」와 맞는 주문이 없습니다</td></tr>`;
  $("[data-crumb]").textContent = q ? `검색 · ${q}` : "전체";
  const o = rows.find((x) => x[0] === st.sel);
  let layer = "";
  if (o) {
    const [cls, label] = BADGE[o[4]];
    layer += `<aside class="drawer" style="top:60px;position:fixed">
      <div class="dr-h"><h2>${o[0]}</h2><span class="badge ${cls}" id="drBadge">${label}</span><span class="x">✕</span></div>
      <div class="dr-b">
        <div class="card"><h3>고객</h3><dl class="kv"><dt>이름</dt><dd>${o[1]}</dd><dt>연락처</dt><dd>010-0000-0000 (가상)</dd><dt>배송지</dt><dd>서울시 가상구 예시로 12</dd></dl></div>
        <div class="card"><h3>상품</h3><ul class="items"><li><span>${o[2]}</span><span>${won(o[3])}</span></li><li><span>배송비</span><span>0원</span></li></ul><div class="d-amount"><span>결제 금액</span><b>${won(o[3])}</b></div></div>
        <div class="card"><h3>처리 기록</h3><ul class="timeline">
          <li class="brand"><i></i><div>결제 완료<p>카드 · 일시불</p></div><small>${o[5]}</small></li>
          <li><i></i><div>배송 준비</div><small>10/21 16:40</small></li>
          ${o[0] === "A-1031" ? `<li class="warn"><i></i><div>환불 요청<p>사유: 분쇄도를 잘못 골랐어요 (고객 요청)</p></div><small>10/22 09:15</small></li>` : ""}
          ${o[4] === "done" ? `<li class="ok"><i></i><div>환불 완료<p>${won(o[3])} · 재고 되돌림</p></div><small>방금</small></li>` : ""}
        </ul></div>
      </div>
      <div class="dr-f"><button class="btn">메모</button>${o[4] === "done" ? `<button class="btn" id="refundBtn" disabled>환불 완료됨</button>` : `<button class="btn pri" id="refundBtn">환불</button>`}</div>
    </aside>`;
    if (st.modal === "refund") {
      layer += `<div class="veil"><div class="modal">
        <h2>환불 — ${o[0]}</h2><p>${o[1]} · ${o[2]}</p>
        <div class="m-b">
          <div class="field"><label>환불 범위</label><div class="seg"><span class="on">전액</span><span>부분</span></div></div>
          <div class="field"><label>환불 금액</label><div class="inp" id="refundAmt"><span>${won(o[3])}</span><small style="color:var(--ink3)">결제 금액과 같음</small></div></div>
          <div class="field"><label>사유</label><div class="inp"><span>고객 요청 · 오주문</span><span style="color:var(--ink3)">▾</span></div></div>
          <p class="chk"><i></i>재고 되돌리기</p>
        </div>
        <div class="m-f"><button class="btn">취소</button><button class="btn bad" id="confirmBtn">${won(o[3])} 환불</button></div>
      </div></div>`;
    }
    if (o[4] === "done" && st.toast !== "0") layer += `<div class="toast"><i></i>${o[0]} 환불 완료<small>${won(o[3])} · 고객에게 알림 보냄</small></div>`;
  }
  $("#layer").innerHTML = layer;
}
$("#q").addEventListener("input", (e) => { typed = e.target.value; render(); });
addEventListener("hashchange", () => { typed = null; render(); });
render();
</script>
</body>
</html>
