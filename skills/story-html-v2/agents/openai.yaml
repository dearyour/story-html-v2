interface:
  display_name: "story-html-v2"
  short_description: "실제 화면 캡처 위를 카메라가 날아다니고, 창 아래 패널이 동작 원리를 모션 그래픽으로 그리는 스크롤 스토리 페이지"
  default_prompt: "$story-html-v2를 사용해 이 제품을 실제로 띄워 화면을 찍고, 장마다 카메라·링·돋보기·데모 커서·녹화 프레임·메커니즘 그래프가 있는 스크롤 스토리 HTML로 만들어줘. 스크롤만 내려도 전부 이해되게 하고, 바닥(starter)을 넘는 시그니처 장면을 새로 만들고, 1440·1280·390·동작 줄이기 캡처를 직접 확인해줘."
